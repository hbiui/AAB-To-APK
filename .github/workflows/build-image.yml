name: Build Docker Image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Login to Alibaba Cloud ACR (personal edition) ---
      - name: Login to Alibaba Cloud ACR
        if: vars.ACR_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # --- Login to GitHub Container Registry (always) ---
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build image tags dynamically ---
      - name: Generate image tags
        id: tags
        run: |
          TAGS="ghcr.io/hbiui/aab-to-apk:latest,ghcr.io/hbiui/aab-to-apk:${{ github.sha }}"
          if [ -n "${{ vars.ACR_REGISTRY }}" ]; then
            TAGS="$TAGS,${{ vars.ACR_REGISTRY }}/hbiui/aab-to-apk:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      # --- Build and push ---
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
